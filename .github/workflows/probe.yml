name: Probe API
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Collections
        run: |
          python3 - <<'PY'
          import json,urllib.request
          def note(m): print("::notice::"+m.replace("\n"," | ")[:950])
          B="https://data.lillemetropole.fr/geoserver/ogc/features/v1/collections/"
          g=lambda u: json.load(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"p"}),timeout=90))
          for c in ["physical_stop","localisation_point_arret","mobilier_point_arret"]:
              d=g(B+"dsp_ilevia:"+c+"/items?f=application/json&limit=3")
              p=[f["properties"] for f in d["features"]]
              note(f"{c} matched={d.get('numberMatched')} ex="+json.dumps(p[:2],ensure_ascii=False))
          ap=g(B+"dsp_ilevia:arret_point/items?f=application/json&limit=6000")["features"]
          pn=[a["properties"] for a in ap if "neuville" in (a["properties"].get("stop_name","")+a["properties"].get("stop_desc","")).lower()]
          note("arret_point neuville="+json.dumps(pn[:5],ensure_ascii=False))
          ps=g(B+"dsp_ilevia:physical_stop/items?f=application/json&limit=9000")["features"]
          pp=[a["properties"] for a in ps if "neuville" in json.dumps(a["properties"],ensure_ascii=False).lower()]
          note("physical_stop neuville="+json.dumps(pp[:4],ensure_ascii=False))
          PY
