name: Probe API
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger les flux temps réel
        run: |
          python3 - <<'PY'
          import urllib.request,re
          def note(m): print("::notice::"+m.replace("\n"," | ").replace("\r","")[:950])
          for name,u in [("siri-sm","https://proxy.transport.data.gouv.fr/resource/ilevia-lille-siri-sm"),("gtfs-rt","https://proxy.transport.data.gouv.fr/resource/ilevia-lille-gtfs-rt")]:
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"probe"}),timeout=60)
                  b=r.read()
                  note(f"{name}: http={r.status} type={r.headers.get('content-type')} bytes={len(b)}")
                  if name=="siri-sm":
                      s=b.decode("utf8","replace")
                      note("debut="+s[:700])
                      i=s.find("MonitoredStopVisit")
                      note("visit="+s[max(0,i-20):i+900])
                      note("nb visites="+str(s.count("<MonitoredStopVisit>")+s.count("\"MonitoredStopVisit\"")))
                  else:
                      note("debut-hex="+b[:60].hex())
              except Exception as e:
                  note(f"{name}: erreur {e}")
          PY
