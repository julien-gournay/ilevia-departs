name: Probe API
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: GTFS
        run: |
          curl -sSL -o gtfs.zip https://media.ilevia.fr/opendata/gtfs.zip
          ls -la gtfs.zip
          python3 - <<'PY'
          import zipfile,csv,io,json,urllib.request,collections
          def note(m): print("::notice::"+m.replace("\n"," | ")[:950])
          z=zipfile.ZipFile("gtfs.zip")
          note("fichiers="+", ".join(f"{i.filename}:{i.file_size//1024}Ko" for i in z.infolist()))
          def rows(n): return csv.DictReader(io.TextIOWrapper(z.open(n),encoding="utf-8-sig"))
          routes={r["route_id"]:r for r in rows("routes.txt")}
          note("routes ex="+json.dumps(list(routes.values())[:2],ensure_ascii=False))
          stops=list(rows("stops.txt")); note("stops cols="+",".join(stops[0].keys())+" ex="+json.dumps(stops[:3],ensure_ascii=False))
          # feed
          B="https://data.lillemetropole.fr/geoserver/ogc/features/v1/collections/"
          g=lambda u: json.load(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"probe"}),timeout=90))
          feed=[f["properties"] for f in g(B+"dsp_ilevia:prochains_passages/items?f=application/json&limit=20000")["features"]]
          fs=collections.defaultdict(set)
          for r in feed: fs[r["code_ligne"]].add(r["sens_ligne"])
          for l in ("84","86","C1","L1","TRAM"): note(f"feed sens {l}="+str(sorted(fs.get(l,[]))))
          note("feed ex id="+str([(r["identifiant_station"],r["nom_station"],r["commune"]) for r in feed[:3]]))
          ap=g(B+"dsp_ilevia:arret_point/items?f=application/json&limit=6000")["features"]
          note("arret_point ex="+json.dumps([a["properties"] for a in ap[:2]],ensure_ascii=False))
          PY
