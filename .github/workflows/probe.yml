name: Probe API
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Index
        run: |
          python3 tools/build_stops.py
          python3 - <<'PY'
          import json,collections
          def note(m): print("::notice::"+m.replace("\n"," | ")[:950])
          d=json.load(open("app/src/main/assets/stops_index.json"))
          st=d["stops"]
          com=collections.Counter(c for n,c in st)
          note("communes distinctes="+str(len(com))+" vides="+str(com.get("",0)))
          note("plus longues communes="+str(sorted(com,key=len,reverse=True)[:14]))
          note("plus longs noms="+str(sorted({n for n,c in st},key=len,reverse=True)[:14]))
          note("noms avec - ou ( ou / ="+str([n for n,c in st if any(x in n for x in "-(/")][:20]))
          note("communes avec chiffres/tirets="+str([c for c in com if any(x.isdigit() for x in c)][:15]))
          note("ex Tourcoing="+str([s for s in st if "tourcoing" in s[0].lower()][:8]))
          PY
