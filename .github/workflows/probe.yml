name: Probe API
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger les flux temps réel
        run: |
          python3 - <<'PY'
          import urllib.request,re,collections
          def note(m): print("::notice::"+m.replace("\n"," | ").replace("\r","")[:950])
          g=lambda u: urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"probe"}),timeout=90).read()
          s=g("https://proxy.transport.data.gouv.fr/resource/ilevia-lille-siri-sm").decode("utf8","replace")
          rec=re.findall(r"<siri:RecordedAtTime>([^<]+)",s)
          exp=re.findall(r"<siri:ExpectedDepartureTime>([^<]+)",s)+re.findall(r"<siri:ExpectedArrivalTime>([^<]+)",s)
          note(f"siri visites={len(rec)} recorded min={min(rec)} max={max(rec)}")
          note(f"siri expected n={len(exp)} min={min(exp) if exp else None} max={max(exp) if exp else None}")
          lines=collections.Counter(re.findall(r"<siri:LineRef>ILEVIA:Line::([^:]+):",s))
          note("siri lignes="+str(len(lines))+" "+",".join(sorted(lines))[:500])
          b=g("https://proxy.transport.data.gouv.fr/resource/ilevia-lille-gtfs-rt")
          txt=b.decode("latin1")
          note("gtfs-rt ids="+",".join(sorted(set(re.findall(r"[A-Z]{3}[0-9A-Z]{3,}",txt)))[:40]))
          PY
