name: Probe API
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger l'API Ilévia
        run: |
          python3 - <<'PY'
          import json,urllib.request,collections,datetime
          def note(m): print("::notice::"+m.replace("\n"," | ")[:900])
          def get(u):
              return json.load(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"probe"}),timeout=60))
          B="https://data.lillemetropole.fr/geoserver/ogc/features/v1/"
          cols=get(B+"collections?f=application/json")["collections"]
          ev=[c["id"] for c in cols if "ilevia" in c["id"].lower() or "ilévia" in (c.get("title","")+c.get("description","")).lower()]
          note("collections ilevia="+", ".join(ev))
          for cid in ev:
              try:
                  d=get(B+"collections/"+cid+"/items?f=application/json&limit=5000")
                  p=[f.get("properties",{}) for f in d["features"]]
                  keys=list(p[0].keys()) if p else []
                  extra=""
                  if p and "code_ligne" in p[0]:
                      extra=" lignes="+str(len(set(r.get("code_ligne") for r in p)))
                  note(f"{cid}: matched={d.get('numberMatched')} returned={d.get('numberReturned')}{extra} keys={','.join(keys)[:200]}")
              except Exception as e:
                  note(f"{cid}: erreur {e}")
          d=get(B+"collections/dsp_ilevia:prochains_passages/items?f=application/json&limit=20000")
          r=[f["properties"] for f in d["features"]]
          note("prochains_passages lignes="+str(collections.Counter(x["code_ligne"] for x in r).most_common(10))+" max_modif="+str(max(x["date_modification"] for x in r)))
          PY
