name: Probe API
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count
        run: |
          python3 - <<'PY'
          import json,urllib.request,collections
          def note(m): print("::notice::"+m.replace("\n"," | ")[:950])
          B="https://data.lillemetropole.fr/geoserver/ogc/features/v1/collections/dsp_ilevia:prochains_passages/items?f=application/json"
          g=lambda u: json.load(urllib.request.urlopen(urllib.request.Request(u,headers={"User-Agent":"p"}),timeout=120))
          d=g(B+"&limit=20000")
          fs=d["features"]
          note("keys="+",".join(d.keys())+" n="+str(len(fs))+" matched="+str(d.get("numberMatched"))+" returned="+str(d.get("numberReturned"))+" links="+json.dumps([l.get("rel") for l in d.get("links",[])]))
          c=collections.Counter((f["properties"]["nom_station"],f["properties"]["code_ligne"],f["properties"]["sens_ligne"]) for f in fs)
          h=collections.Counter(c.values())
          note("rows per key histogram="+json.dumps(sorted(h.items())))
          k=[x for x,v in c.items() if v>=5][:1]
          if k:
            rows=[f["properties"] for f in fs if (f["properties"]["nom_station"],f["properties"]["code_ligne"],f["properties"]["sens_ligne"])==k[0]]
            note(json.dumps(rows,ensure_ascii=False))
          ex=fs[0]["properties"]; note("sample="+json.dumps(ex,ensure_ascii=False))
          d2=g(B+"&limit=20000&startIndex=%d"%len(fs))
          note("next page n="+str(len(d2["features"])))
          PY
