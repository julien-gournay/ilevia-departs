name: Probe API
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Perturbations
        run: |
          python3 - <<'PY'
          import urllib.request,json,collections
          def note(m): print("::notice::"+m.replace("\n"," | ")[:950])
          B="https://data.lillemetropole.fr/geoserver/ogc/features/v1/collections/"
          for cid in ["dsp_ilevia:perturbations"]:
              d=json.load(urllib.request.urlopen(urllib.request.Request(B+cid+"/items?f=application/json&limit=3000",headers={"User-Agent":"probe"}),timeout=60))
              p=[f["properties"] for f in d["features"]]
              note(f"{cid} n={len(p)} matched={d.get('numberMatched')}")
              if p:
                  note("keys="+",".join(p[0].keys()))
                  note("ex1="+json.dumps(p[0],ensure_ascii=False))
                  if len(p)>1: note("ex2="+json.dumps(p[1],ensure_ascii=False))
                  for k in p[0]:
                      if any(s in k for s in ("ligne","type","cause","effet","statut","severite","gravite")):
                          note(k+"="+str(collections.Counter(str(x.get(k))[:40] for x in p).most_common(8)))
          PY
