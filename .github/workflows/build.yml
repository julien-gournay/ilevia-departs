name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accepter les licences du SDK Android (préinstallé)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compiler l'APK signé
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk IleviaDeparts.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IleviaDeparts-apk
          path: IleviaDeparts.apk
      - name: Publier une version (utilisée par la mise à jour dans l'app)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" IleviaDeparts.apk \
            --title "Version ${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
